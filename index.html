<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validade de Pastas de Rede</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 6.5C3 5.67 3.67 5 4.5 5H9.5L11.5 7H19.5C20.33 7 21 7.67 21 8.5V17.5C21 18.33 20.33 19 19.5 19H4.5C3.67 19 3 18.33 3 17.5V6.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M16.5 12V15M16.5 15L18 16.5M16.5 15L15 16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <div>
          <h1>Validade de Pastas</h1>
          <p class="brand-sub">Pastas de rede com prazo vencido &middot; consulta somente leitura</p>
        </div>
      </div>
    </header>

    <main>

      <section class="scan-card">
        <form id="form-busca" class="scan-form" autocomplete="off">
          <div class="field">
            <label for="caminho">Caminho da pasta de rede</label>
            <input
              type="text"
              id="caminho"
              name="caminho"
              placeholder="\\servidor\compartilhamento\pasta"
              required
            >
          </div>
          <button type="submit" id="btn-buscar" class="btn-primary">
            <span class="btn-spinner" hidden></span>
            <span class="btn-label">Buscar pastas</span>
          </button>
        </form>
        <p class="hint">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M10 2L17 5.5V10C17 13.9 14 17.4 10 18C6 17.4 3 13.9 3 10V5.5L10 2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M7.3 10.1L9.1 11.9L12.9 8.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Nenhuma pasta ou arquivo é alterado, movido ou excluído nesta consulta.
        </p>
      </section>

      <div id="status-area" aria-live="polite"></div>

      <section id="resultados-section" hidden>

        <div class="results-toolbar">
          <div class="results-count" id="results-count"></div>
          <div class="toolbar-actions">
            <button type="button" id="btn-exportar-excel" class="btn-secondary">
              <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M4 3.5C4 2.67 4.67 2 5.5 2H12L16 6V16.5C16 17.33 15.33 18 14.5 18H5.5C4.67 18 4 17.33 4 16.5V3.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                <path d="M12 2V5.5C12 5.78 12.22 6 12.5 6H16" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                <path d="M7.5 10L10 13.5L12.5 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M10 9V13.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
              <span>Exportar para Excel</span>
            </button>
            <button type="button" id="btn-salvar-log" class="btn-secondary">
              <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M4 3.5C4 2.67 4.67 2 5.5 2H12L16 6V16.5C16 17.33 15.33 18 14.5 18H5.5C4.67 18 4 17.33 4 16.5V3.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                <path d="M12 2V5.5C12 5.78 12.22 6 12.5 6H16" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                <path d="M7 11H13M7 14H13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
              <span>Salvar log</span>
            </button>
            <button type="button" id="btn-copiar-todos" class="btn-secondary">
              <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="7" y="7" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
                <path d="M13 7V5.5C13 4.67 12.33 4 11.5 4H4.5C3.67 4 3 4.67 3 5.5V12.5C3 13.33 3.67 14 4.5 14H7" stroke="currentColor" stroke-width="1.4"/>
              </svg>
              <span id="btn-copiar-todos-label">Copiar todos os caminhos</span>
            </button>
          </div>
        </div>

        <div class="filters-bar">
          <div class="filter-search">
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/>
              <path d="M17 17L13.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input type="search" id="filtro-texto" placeholder="Filtrar por nome ou caminho...">
          </div>

          <select id="filtro-severidade" aria-label="Filtrar por gravidade">
            <option value="todas">Todas as gravidades</option>
            <option value="atencao">Atenção (3–5 meses)</option>
            <option value="vencida">Vencida (6–11 meses)</option>
            <option value="critica">Crítica (12+ meses)</option>
          </select>

          <select id="filtro-ordenacao" aria-label="Ordenar resultados">
            <option value="antigas">Mais antigas primeiro</option>
            <option value="recentes">Mais recentes primeiro</option>
            <option value="nome">Nome (A–Z)</option>
          </select>
        </div>

        <div id="avisos-area"></div>

        <ul id="lista-resultados" class="results-list"></ul>

        <p id="empty-filtered" class="empty-inline" hidden>
          Nenhuma pasta corresponde aos filtros aplicados.
        </p>
      </section>

      <div id="empty-state" class="state-panel" hidden></div>
      <div id="error-state" class="state-panel state-panel--error" hidden></div>

    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Biblioteca usada apenas no navegador para montar o arquivo .xlsx exportado -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
